name: loan-engine
x-app: &app
  image: loan-engine-app:local
  build:
    context: .
    dockerfile: backend/Dockerfile
  env_file: .env
  environment: &app-env
    DATABASE_URL: postgresql+psycopg://loan:${POSTGRES_PASSWORD}@postgres:5432/loan
    S3_ENDPOINT: http://minio:9000
    S3_PUBLIC_ENDPOINT: http://localhost:9000
    AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
    AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    SMTP_HOST: mailpit
    N8N_URL: http://n8n:5678
  restart: unless-stopped
services:
  postgres:
    image: postgres:16.8-alpine
    environment:
      POSTGRES_USER: loan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: loan
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./infrastructure/sql/init.sql:/docker-entrypoint-initdb.d/01-n8n.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U loan -d loan"]
      interval: 5s
      retries: 20
    restart: unless-stopped
  minio:
    build:
      context: .
      dockerfile: infrastructure/minio.Dockerfile
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:8000
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio:/data"]
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/minio/health/live]
      interval: 5s
      retries: 20
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit:v1.24.1
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]
    volumes: ["mailpit:/data"]
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 15000
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 5s
      retries: 20
    restart: unless-stopped
  migrate:
    <<: *app
    command: alembic upgrade head
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}
  storage-init:
    <<: *app
    command: python scripts/init_storage.py
    restart: "no"
    depends_on:
      minio: {condition: service_healthy}
  api:
    <<: *app
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      storage-init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      retries: 15
  ingestion-worker:
    <<: *app
    command: python -m app.worker ingestion
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "from app.db import engine; from sqlalchemy import text; engine().connect().execute(text('SELECT 1'))"]
      interval: 30s
      retries: 3
  dispatcher:
    <<: *app
    command: python -m app.worker dispatcher
    depends_on:
      api: {condition: service_healthy}
      n8n: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "from app.db import engine; from sqlalchemy import text; engine().connect().execute(text('SELECT 1'))"]
      interval: 30s
      retries: 3
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.43.6
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: loan
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: Asia/Kolkata
      TZ: Asia/Kolkata
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 24
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      WORKFLOW_SECRET: ${WORKFLOW_SECRET}
      DEMO_MODE: 'true'
    ports: ["127.0.0.1:5678:5678"]
    volumes:
      - n8n:/home/node/.n8n
      - ./n8n:/workflows:ro
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:5678/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      retries: 30
    restart: unless-stopped
volumes:
  postgres:
  minio:
  mailpit:
  n8n:
