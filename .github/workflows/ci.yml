name: engineering-checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.8-alpine
        env: {POSTGRES_USER: loan, POSTGRES_PASSWORD: ci-only, POSTGRES_DB: loan_test}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U loan" --health-interval 5s --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql+psycopg://loan:ci-only@localhost:5432/loan_test
      DATABASE_URL: postgresql+psycopg://loan:ci-only@localhost:5432/loan_test
      API_TOKEN: ci-test-token-only-000000000
      WORKFLOW_SECRET: ci-test-secret-only-000000000
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r backend/requirements-dev.txt
      - run: pip-audit -r backend/requirements.txt
      - run: ruff check backend scripts migrations
      - run: mypy backend/app
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest --junitxml=reports/pytest.xml
      - run: python scripts/validate_workflows.py
      - run: python scripts/validate_config.py
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node frontend/build.mjs
      - run: cp .env.example .env && docker compose config --quiet
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: test-evidence, path: reports/}
