[tool.pytest.ini_options]
pythonpath = ["backend", "."]
testpaths = ["backend/tests"]
markers = ["integration: requires PostgreSQL", "e2e: requires full Compose stack"]
[tool.ruff]
target-version = "py312"
line-length = 110
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
[tool.mypy]
python_version = "3.12"
files = ["backend/app"]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
